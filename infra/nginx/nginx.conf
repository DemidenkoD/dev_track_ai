# DevTrack AI — Production edge reverse proxy (Track 6 ownership).
# Terminates TLS, redirects HTTP -> HTTPS, injects security headers, and
# routes to the frontend SPA and backend FastAPI services.
events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time up=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    # --- Response compression (static SPA assets + JSON API) ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml;

    # --- Basic API rate limiting (4 GB VPS guard: 10 req/s per client IP,
    # analysis endpoints are expensive) ---
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    # --- Security headers applied to every response ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    # --- HTTP -> HTTPS redirect (Let's Encrypt HTTP-01 challenge still served) ---
    server {
        listen 80;
        # TODO(prod): replace `_` with the real domain (e.g.
        # `server_name devtrack.example.com;`) and point DNS A/AAAA at this
        # VPS before requesting certs. `_` is a catch-all for first boot only.
        server_name _;

        # Edge health endpoint for VPS monitors / CI gates (no TLS needed).
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 'ok';
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS edge ---
    server {
        listen 443 ssl;
        # TODO(prod): set the real domain here (must match the cert CN/SAN).
        server_name _;

        # Mount real certs at /etc/nginx/certs (see docker-compose.prod.yml
        # certs volume). Self-signed placeholders are NOT shipped: bootstrap
        # once with certbot, then restart nginx.
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS: only active over a valid HTTPS vhost.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Edge health endpoint (load-balancer / CI deploy gate probes).
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 'ok';
        }

        # Frontend SPA.
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Backend FastAPI (includes /api/v1/health probes).
        location /api/ {
            # Burst-tolerant throttle so one client can't saturate the 4 GB VPS.
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }
    }
}
