# DevTrack AI — Local SPA server block (baked into frontend/Dockerfile).
# API traffic is proxied to the backend service so the browser never needs
# CORS wildcards in local dev.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (also enforced at the prod edge proxy).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container health endpoint (used by compose healthcheck in prod).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 'ok';
    }

    # Backend API (same-origin proxy -> backend:8000).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching (hashed vite assets are immutable).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
