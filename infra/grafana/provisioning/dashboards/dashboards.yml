# DevTrack AI — Grafana dashboard provisioning.
apiVersion: 1

providers:
  - name: "devtrack"
    orgId: 1
    folder: "DevTrack AI"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # JSON dashboard files are mounted at /var/lib/grafana/dashboards
      # (see docker-compose.yml grafana volumes). Do NOT point this at
      # /etc/grafana/provisioning/dashboards — that directory holds this
      # provisioning file itself; mounting host dashboards over it would
      # shadow (hide) the provider config.
      path: /var/lib/grafana/dashboards
