# DevTrack AI — Tempo config (minimal, OTLP receiver for OTEL SDKs).
# Matches .env.example OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 24h

ingester:
  # Cut live head blocks earlier so WAL replay + compaction stay small on a
  # 512M-capped VPS container (vParquet4 WAL replay OOM fix).
  max_block_duration: 10m
  max_block_bytes: 52428800 # 50MB
