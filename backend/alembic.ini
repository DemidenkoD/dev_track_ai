# DevTrack AI — Alembic configuration (Track 1).
#
# Preferred migration workflow (PostgreSQL/Docker):
#     cd backend && alembic upgrade head
#
# `backend/app/db/init_db.py` keeps a `Base.metadata.create_all()` fallback so
# local boot and tests work without running migrations; Alembic is the source
# of truth for schema evolution in production.

[alembic]
script_location = alembic
# Overridden at runtime by alembic/env.py from Settings.DATABASE_URL.
sqlalchemy.url = sqlite:///./devtrack_ai.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
