# DevTrack AI — Production VPS stack (Track 6 ownership).
# Target: 4 GB RAM / 120 GB SSD Linux VPS. Single command:
#   docker compose -f docker-compose.prod.yml up -d --build
# Differences vs local: Nginx edge proxy with HTTPS + security headers,
# no dev port publishing for backend/db, persistent named volumes only
# (no bind-mounts for data), memory caps so analysis jobs can't OOM the box.
name: devtrack-ai-prod

services:
  db:
    image: postgres:16.4-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production .env}
      POSTGRES_DB: ${POSTGRES_DB:-devtrack_ai}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-devtrack} -d $${POSTGRES_DB:-devtrack_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: devtrack-ai-backend:${IMAGE_TAG:-latest}
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    # Loki log shipping (OPT-IN): requires the loki docker plugin on the VPS:
    #   docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
    # Then uncomment to ship with {app="backend"} labels. Stays commented so
    # a plugin-less host still boots.
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://localhost:3100/loki/api/v1/push"
    #     loki-external-labels: "app=backend,env=production"
    #     keep-file: "true"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in production .env}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in production .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-devtrack-ai-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-300}
      MAX_REPO_SIZE_MB: ${MAX_REPO_SIZE_MB:-250}
    # No host ports: reachable only via nginx edge proxy on the `app` net.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [app]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: devtrack-ai-backend:${IMAGE_TAG:-latest}
    restart: always
    command: ["python", "-m", "app.worker.runner"]
    # Loki log shipping (OPT-IN, same plugin prerequisite as backend):
    # uncomment to ship with {app="worker"} labels.
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://localhost:3100/loki/api/v1/push"
    #     loki-external-labels: "app=worker,env=production"
    #     keep-file: "true"
    healthcheck:
      # Slim image has no pg_isready/curl: stdlib TCP dial to db:5432 plus
      # PID 1 cmdline must be the Track 3 runner (update if renamed).
      test: ["CMD-SHELL", "python -c \"import socket,pathlib; socket.create_connection(('db',5432),timeout=5).close(); cmd=pathlib.Path('/proc/1/cmdline').read_bytes().decode(); assert 'runner' in cmd, cmd\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in production .env}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in production .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-devtrack-ai-worker}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-300}
      MAX_REPO_SIZE_MB: ${MAX_REPO_SIZE_MB:-250}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks: [app]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: devtrack-ai-frontend:${IMAGE_TAG:-latest}
    restart: always
    healthcheck:
      # nginx:alpine ships busybox wget (no curl needed).
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]

  # Edge reverse proxy: HTTPS termination + security headers + /api routing.
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS certs (placeholder volume; populate via certbot on first boot).
      - certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [app]

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prom_data_prod:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks: [app]

  loki:
    image: grafana/loki:2.9.6
    restart: always
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data_prod:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks: [app]

  tempo:
    image: grafana/tempo:2.6.0
    restart: always
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./infra/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data_prod:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks: [app]

  grafana:
    image: grafana/grafana:10.4.3
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      # MUST-OVERRIDE: no silent default — compose fails fast if unset so a
      # production Grafana can never boot with a well-known password.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in production .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSONs mount to /var/lib/grafana/dashboards (NOT to
      # /etc/grafana/provisioning/dashboards — that would shadow the
      # dashboards.yml provider config). Must match `path:` in
      # infra/grafana/provisioning/dashboards/dashboards.yml.
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks: [app]

volumes:
  pgdata_prod:
  prom_data_prod:
  loki_data_prod:
  tempo_data_prod:
  grafana_data_prod:
  certs:
  certbot_www:

networks:
  app:
    driver: bridge
