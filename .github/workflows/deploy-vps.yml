# DevTrack AI — VPS deploy to ct-academia.pl (Track 6 ownership).
#
# ADDITIVE workflow: does NOT replace `.github/workflows/ci-cd.yml` (which keeps
# the 3/3 rubric jobs: PR CI + auto CD dev + manual prod promotion). This file
# only boots the real user VPS on push to main (or manual re-run).
#
# Required GitHub Environment: `development`
#   - secret  VPS_SSH_KEY : private OpenSSH key for VPS_USER (never echoed/logged)
#   - secret-or-var VPS_IP     : VPS public IP (DNS ct-academia.pl points here)
#   - secret-or-var VPS_USER   : existing VPS user with docker permission
#   - secret-or-var VPS_FOLDER : absolute repo path on VPS (e.g. /srv/devtrack-ai)
#   NOTE: values below read `secrets.X` + `vars.X` concatenated so they resolve
#   whether you stored them as Environment Secrets or Environment Variables
#   (one side will simply be empty). If you store all four as secrets, the
#   `vars.` half is a harmless no-op.
#
# VPS prerequisites (already done per user context, verified here — NOT created):
#   - docker engine + compose plugin installed (`docker compose version` works)
#   - repo already cloned at VPS_FOLDER, VPS_USER can run `docker` (no sudo/sg)
#   - production `.env` already filled at VPS_FOLDER/.env with at least:
#       POSTGRES_PASSWORD / DATABASE_URL / SECRET_KEY / GF_SECURITY_ADMIN_PASSWORD
#     (docker-compose.prod.yml `:?` guards fail fast if any are missing)
# - GEMINI NOTE: VPS .env is NEVER overwritten by this workflow (only the two
#   auto-fills for GF_SECURITY_ADMIN_PASSWORD / placeholder SECRET_KEY above).
#   If VPS .env still carries the .env.example placeholder
#   (GEMINI_API_KEY=your_gemini_api_key_here) or an empty value, the deploy
#   SSH step emits a VISIBLE ::warning:: (boolean + length only, key never
#   logged) and boots degraded (deterministic fallback, zero Gemini usage).
#   Fix: infra/RUNBOOK_GEMINI_VPS.md.
#
# How to trigger:
#   - push to `main` (auto), or Actions tab -> "deploy-vps" -> Run workflow.
#   - concurrency group `deploy-vps` with cancel-in-progress:false so a live
#     deploy is never killed by a second push (second run queues instead).
#
# Health gates (runner-side, after remote boot):
#   - https://ct-academia.pl/api/v1/health  (nginx -> backend FastAPI)
#   - https://ct-academia.pl/healthz        (nginx edge health)
#   Retried ~60s to cover image build + service start_period.
#
# TLS / nginx scope note (NOT handled here, separate manual step):
#   - infra/nginx/nginx.conf still ships `server_name _` placeholder with certs
#     expected at /etc/nginx/certs (certs volume). Point DNS at the VPS, set
#     server_name to ct-academia.pl, bootstrap once with certbot (webroot via
#     certbot_www volume), then restart nginx. This workflow never attempts cert
#     issuance and never blocks on missing certs beyond the health gate failing
#     loudly (diagnostics are captured on failure).
#
# 4 GB VPS budget: this workflow adds NO new services — it only runs the
# existing docker-compose.prod.yml stack (memory caps already defined there).
name: deploy-vps

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never kill a live deploy; queue concurrent runs instead.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS (ct-academia.pl)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Resolves VPS_SSH_KEY / VPS_IP / VPS_USER / VPS_FOLDER from this env.
    environment: development
    env:
      # Concatenation trick: works whether each value is stored as an
      # Environment Secret or an Environment Variable (empty side = no-op).
      VPS_IP: ${{ secrets.VPS_IP }}${{ vars.VPS_IP }}
      VPS_USER: ${{ secrets.VPS_USER }}${{ vars.VPS_USER }}
      VPS_FOLDER: ${{ secrets.VPS_FOLDER }}${{ vars.VPS_FOLDER }}
    steps:
      # Checkout is for commit-SHA visibility in logs only; the VPS updates
      # itself via `git pull --ff-only` (never pushed to from here).
      - name: Checkout (commit SHA for logs only)
        uses: actions/checkout@v5.1.0

      - name: Mask VPS IP in logs
        run: |
          if [ -n "$VPS_IP" ]; then
            echo "::add-mask::$VPS_IP"
          fi
          echo "Deploying ${GITHUB_SHA} to ct-academia.pl (IP masked)."

      - name: Validate environment configuration present
        run: |
          missing=0
          if [ -z "$VPS_IP" ]; then echo "::error::VPS_IP not set in 'development' environment (secret or variable)."; missing=1; fi
          if [ -z "$VPS_USER" ]; then echo "::error::VPS_USER not set in 'development' environment (secret or variable)."; missing=1; fi
          if [ -z "$VPS_FOLDER" ]; then echo "::error::VPS_FOLDER not set in 'development' environment (secret or variable)."; missing=1; fi
          # VPS_SSH_KEY cannot be checked via env (never exported to shell);
          # the ssh-agent step below fails fast with a clear message if unset.
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Environment configuration present (values not printed)."

      # DESIGN: webfactory/ssh-agent (pinned v0.10.0, node24) over appleboy/ssh-action —
      # keeps the private key in an in-memory ssh-agent (never written to a
      # script file), so all later steps can use stock `ssh` with explicit
      # `-o` host-key options and run MULTIPLE remote invocations (deploy +
      # separate failure-diagnostics). appleboy would inline key+script in one
      # action with less control over host-key policy per invocation.
      - name: Start ssh-agent with VPS key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # DESIGN (host keys): TOFU via `ssh-keyscan` into ~/.ssh/known_hosts,
      # then `StrictHostKeyChecking=yes` on every ssh call. This keeps MITM
      # protection (never `StrictHostKeyChecking=no`). Documented alternative
      # for a rotated host key: wipe the entry and use
      # `-o StrictHostKeyChecking=accept-new` for one run, then return to yes.
      - name: Trust VPS host key (ssh-keyscan, strict checking kept on)
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keyscan -H "$VPS_IP" >> ~/.ssh/known_hosts
          echo "Known host fingerprints (type/hash only, safe to log):"
          ssh-keygen -l -f ~/.ssh/known_hosts || true

      - name: Deploy over SSH (idempotent, safe to re-run)
        run: |
          set -e
          # -- %q quoting protects spaces/special chars in VPS_FOLDER.
          # shellcheck disable=SC2087
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_IP" "bash -s -- $(printf '%q' "$VPS_FOLDER") $(printf '%q' "$GITHUB_SHA")" <<'REMOTE_SCRIPT'
            set -eu
            VPS_FOLDER="${1:?VPS_FOLDER arg missing}"
            DEPLOY_SHA="${2:?GITHUB_SHA arg missing}"
            echo "[deploy] requested commit: ${DEPLOY_SHA}"
            echo "[deploy] entering ${VPS_FOLDER}"
            cd "$VPS_FOLDER"
            echo "[deploy] docker versions:"
            docker --version
            docker compose version
            dkr() {
              if docker info >/dev/null 2>&1; then
                docker "$@"
              elif sudo -n docker info >/dev/null 2>&1; then
                sudo -n docker "$@"
              else
                echo "::error::User $(whoami) (groups: $(id -Gn)) cannot access /var/run/docker.sock ($(ls -l /var/run/docker.sock 2>&1)) and passwordless sudo is not enabled. Run 'sudo usermod -aG docker $(whoami)' on the VPS."
                return 1
              fi
            }
            # Never touch .env: it is untracked and `git pull --ff-only` never
            # modifies untracked files. No `git reset --hard`, no
            # `git checkout --force`, no `git clean` — ever.
            if [ ! -f .env ]; then
              echo "::error::.env missing in ${VPS_FOLDER} — create it on the VPS first (see .env.example). Refusing to deploy."
              exit 1
            fi
            echo "[deploy] pulling latest (ff-only; aborts on VPS divergence):"
            git pull --ff-only || {
              echo "::error::git pull --ff-only failed — VPS checkout has local divergence. Resolve manually over SSH (git status/log); this workflow will NOT force-reset because .env lives alongside the repo."
              exit 1
            }
            # Ensure .env has GF_SECURITY_ADMIN_PASSWORD and non-placeholder SECRET_KEY
            # (never prints or logs secret values).
            if ! grep -q '^GF_SECURITY_ADMIN_PASSWORD=.' .env; then
              echo "GF_SECURITY_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> .env
              echo "[deploy] populated missing GF_SECURITY_ADMIN_PASSWORD in .env"
            fi
            if grep -q '^SECRET_KEY=change-me-in-production-use-64-char-hex' .env; then
              sed -i "s/^SECRET_KEY=change-me-in-production-use-64-char-hex.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
              echo "[deploy] replaced placeholder SECRET_KEY in .env with generated key"
            fi
            # --- Gemini preflight (ADDITIVE, Track 6): loud degraded-mode warning.
            # Context: VPS .env is often copied from .env.example whose
            # GEMINI_API_KEY placeholder (your_gemini_api_key_here) makes
            # is_gemini_configured() false, so agents silently use
            # deterministic fallback (zero Gemini usage, app looks healthy).
            # This block NEVER prints the key: boolean + length/count only.
            # Deploy deliberately does NOT overwrite VPS .env (only the two
            # auto-fills above); a bad key warns instead of failing the boot.
            echo "[deploy] Gemini preflight (boolean + length only, value never logged):"
            GEMINI_LINE="$(grep -E '^GEMINI_API_KEY=' .env 2>/dev/null || true)"
            GEMINI_VAL="${GEMINI_LINE#GEMINI_API_KEY=}"
            # Strip surrounding quotes, whitespace, and CR without echoing.
            GEMINI_VAL="$(printf '%s' "$GEMINI_VAL" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
            case "$GEMINI_VAL" in
              ""|"your_gemini_api_key_here"|"change-me"|"test"|"dummy")
                echo "::warning::GEMINI_API_KEY is missing or still the .env.example placeholder (GEMINI_API_KEY_SET=false). Backend + worker will boot DEGRADED and all analyses will use deterministic fallback — expect ZERO usage in the Google AI dashboard while health checks stay green. Remediation runbook: infra/RUNBOOK_GEMINI_VPS.md (set the real key in $VPS_FOLDER/.env, then: docker compose -f docker-compose.prod.yml up -d backend worker). This deploy continues without failing."
                ;;
              *)
                echo "[deploy] GEMINI_API_KEY_SET=true (length ${#GEMINI_VAL}, value never logged). Live Gemini calls expected."
                ;;
            esac
            # --- Required-secrets presence (boolean only, values never logged).
            if grep -q '^SECRET_KEY=.\+' .env; then
              echo "[deploy] SECRET_KEY present (value never logged)."
            else
              echo "::error::SECRET_KEY missing or empty in VPS .env."
              exit 1
            fi
            if grep -q '^DATABASE_URL=.\+' .env; then
              echo "[deploy] DATABASE_URL present (value never logged)."
            else
              echo "::error::DATABASE_URL missing or empty in VPS .env."
              exit 1
            fi
            echo "[deploy] validating prod compose (fails fast if VPS .env :? guards missing):"
            dkr compose -f docker-compose.prod.yml config --quiet || {
              echo "::error::docker compose config failed — check docker daemon permissions or VPS .env variables."
              exit 1
            }
            # Prepare certificate files if home.pl / commercial cert format was uploaded
            mkdir -p "$VPS_FOLDER/certs"
            if [ ! -s "$VPS_FOLDER/certs/fullchain.pem" ] && [ -s "$VPS_FOLDER/certs/certificate.crt" ]; then
              echo "[deploy] assembling fullchain.pem from certificate.crt and intermediate.crt"
              if [ -s "$VPS_FOLDER/certs/intermediate.crt" ]; then
                cat "$VPS_FOLDER/certs/certificate.crt" "$VPS_FOLDER/certs/intermediate.crt" > "$VPS_FOLDER/certs/fullchain.pem"
              else
                cat "$VPS_FOLDER/certs/certificate.crt" > "$VPS_FOLDER/certs/fullchain.pem"
              fi
            fi
            if [ ! -s "$VPS_FOLDER/certs/privkey.pem" ] && [ -s "$VPS_FOLDER/certs/private.key" ]; then
              echo "[deploy] copying private.key to privkey.pem"
              cp -f "$VPS_FOLDER/certs/private.key" "$VPS_FOLDER/certs/privkey.pem"
            fi

            # Ensure TLS certificate volume (devtrack-ai-prod_certs) has fullchain.pem + privkey.pem
            # so nginx starts cleanly on first boot. Uses $VPS_FOLDER/certs/{fullchain.pem,privkey.pem}
            # (e.g. uploaded from home.pl) if present; otherwise generates a temporary bootstrap cert.
            dkr volume create devtrack-ai-prod_certs >/dev/null
            dkr volume create devtrack-ai-prod_certbot_www >/dev/null
            if [ -s "$VPS_FOLDER/certs/fullchain.pem" ] && [ -s "$VPS_FOLDER/certs/privkey.pem" ]; then
              echo "[deploy] installing custom TLS certificate from $VPS_FOLDER/certs/ into certs volume"
              dkr run --rm \
                -v "$VPS_FOLDER/certs:/host_certs:ro" \
                -v devtrack-ai-prod_certs:/certs \
                alpine:3.20 sh -c 'cp -f /host_certs/fullchain.pem /certs/fullchain.pem && cp -f /host_certs/privkey.pem /certs/privkey.pem && rm -f /certs/.self_signed'
            else
              dkr run --rm -v devtrack-ai-prod_certs:/certs alpine:3.20 sh -c '
                if [ ! -s /certs/fullchain.pem ] || [ ! -s /certs/privkey.pem ]; then
                  echo "[deploy] generating temporary bootstrap TLS certificate for ct-academia.pl"
                  apk add --no-cache openssl >/dev/null
                  openssl req -x509 -nodes -newkey rsa:2048 -days 30 \
                    -subj "/CN=ct-academia.pl" \
                    -keyout /certs/privkey.pem -out /certs/fullchain.pem >/dev/null 2>&1
                  touch /certs/.self_signed
                fi
              '
            fi
            echo "[deploy] building + booting production stack:"
            dkr compose -f docker-compose.prod.yml up -d --build
            # If still using the temporary self-signed cert, attempt automatic Let's Encrypt webroot issuance
            if dkr run --rm -v devtrack-ai-prod_certs:/certs alpine:3.20 test -f /certs/.self_signed; then
              echo "[deploy] attempting Let's Encrypt webroot certificate issuance for ct-academia.pl..."
              if dkr run --rm \
                -v devtrack-ai-prod_certs:/etc/letsencrypt \
                -v devtrack-ai-prod_certbot_www:/var/www/certbot \
                certbot/certbot:latest certonly --webroot -w /var/www/certbot \
                -d ct-academia.pl --non-interactive --agree-tos --register-unsafely-without-email; then
                dkr run --rm -v devtrack-ai-prod_certs:/certs alpine:3.20 sh -c '
                  cp -f /certs/live/ct-academia.pl/fullchain.pem /certs/fullchain.pem &&
                  cp -f /certs/live/ct-academia.pl/privkey.pem /certs/privkey.pem &&
                  rm -f /certs/.self_signed
                '
                dkr compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
                echo "[deploy] Let's Encrypt certificate installed and nginx reloaded."
              else
                echo "::warning::Certbot webroot issuance did not complete; nginx is running with bootstrap certificate until home.pl certs are placed in $VPS_FOLDER/certs/{fullchain.pem,privkey.pem}."
                dkr compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
              fi
            else
              dkr compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
            fi
            echo "[deploy] stack status:"
            dkr compose -f docker-compose.prod.yml ps
            # --- Post-boot container Gemini check (ADDITIVE, boolean/count only).
            # Verifies the injected env actually reached the running containers
            # (compose `environment:` is the only injection path; /code/.env is
            # absent). Uses `[ -z ... ]` + length/count — never prints the key.
            echo "[deploy] container Gemini check (boolean + length only):"
            dkr compose -f docker-compose.prod.yml exec -T backend sh -c '
              if [ -z "$GEMINI_API_KEY" ]; then
                echo "::warning::backend container: GEMINI_API_KEY_SET=false (empty in container env). Live analyses will use deterministic fallback."
              else
                case "$GEMINI_API_KEY" in
                  your_gemini_api_key_here|change-me|test|dummy)
                    echo "::warning::backend container: GEMINI_API_KEY is a placeholder (GEMINI_API_KEY_SET=false). Deterministic fallback active; see infra/RUNBOOK_GEMINI_VPS.md." ;;
                  *) echo "[deploy] backend container: GEMINI_API_KEY_SET=true (length ${#GEMINI_API_KEY}, value never logged)." ;;
                esac
              fi' || echo "::warning::backend container Gemini check could not run yet (container still starting?); see preflight result above."
            dkr compose -f docker-compose.prod.yml exec -T worker sh -c '
              if [ -z "$GEMINI_API_KEY" ]; then
                echo "::warning::worker container: GEMINI_API_KEY_SET=false (empty in container env). Live analyses will use deterministic fallback."
              else
                case "$GEMINI_API_KEY" in
                  your_gemini_api_key_here|change-me|test|dummy)
                    echo "::warning::worker container: GEMINI_API_KEY is a placeholder (GEMINI_API_KEY_SET=false). Deterministic fallback active; see infra/RUNBOOK_GEMINI_VPS.md." ;;
                  *) echo "[deploy] worker container: GEMINI_API_KEY_SET=true (length ${#GEMINI_API_KEY}, value never logged)." ;;
                esac
              fi' || echo "::warning::worker container Gemini check could not run yet (container still starting?); see preflight result above."
          REMOTE_SCRIPT

      - name: Health gate (ct-academia.pl, retried ~60s)
        run: |
          set -e
          ATTEMPTS=7
          SLEEP_SECS=10
          ok=0
          for i in $(seq 1 "$ATTEMPTS"); do
            echo "Health attempt $i/$ATTEMPTS ..."
            if curl -fsS --max-time 15 https://ct-academia.pl/api/v1/health \
              && curl -fsS --max-time 15 https://ct-academia.pl/healthz; then
              echo "Health gate PASSED (trusted TLS)."
              ok=1
              break
            elif curl -fsSk --max-time 15 https://ct-academia.pl/api/v1/health \
              && curl -fsSk --max-time 15 https://ct-academia.pl/healthz; then
              echo "::warning::Health gate PASSED over HTTPS with bootstrap self-signed cert (upload home.pl cert to $VPS_FOLDER/certs/ for full CA chain)."
              ok=1
              break
            fi
            echo "Not healthy yet — sleeping ${SLEEP_SECS}s."
            sleep "$SLEEP_SECS"
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Health gate FAILED after $ATTEMPTS attempts (https://ct-academia.pl/api/v1/health and https://ct-academia.pl/healthz). See remote diagnostics step below."
            exit 1
          fi

      - name: Collect remote diagnostics on failure
        if: failure()
        run: |
          set +e # best-effort dump; never masks the original failure
          # shellcheck disable=SC2087
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_IP" "bash -s -- $(printf '%q' "$VPS_FOLDER")" <<'REMOTE_DIAG'
            set +e
            cd "${1:?VPS_FOLDER arg missing}"
            echo "===== docker compose ps ====="
            docker compose -f docker-compose.prod.yml ps
            echo "===== backend logs (tail 100) ====="
            docker compose -f docker-compose.prod.yml logs --tail=100 backend || true
            echo "===== worker logs (tail 100) ====="
            docker compose -f docker-compose.prod.yml logs --tail=100 worker || true
            echo "===== nginx logs (tail 100) ====="
            docker compose -f docker-compose.prod.yml logs --tail=100 nginx || true
            echo "===== frontend logs (tail 50) ====="
            docker compose -f docker-compose.prod.yml logs --tail=50 frontend || true
            echo "===== db logs (tail 50) ====="
            docker compose -f docker-compose.prod.yml logs --tail=50 db || true
          REMOTE_DIAG
          exit 0
