[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Track 5 QA gate: run the non-negotiable invariant suite with
#   pytest -m invariants -ra
# `-ra` surfaces skip reasons in the summary so missing Track 1 wiring or
# optional SDKs can never produce a silent green pass — every skip is counted.
addopts = -ra --strict-markers
markers =
    contract: REST/OpenAPI contract shape tests (API_CONTRACT.md frozen, /api/v1)
    invariants: non-negotiable product invariants (score_state, ephemeral email, SSRF, read-only)
    unit: fast mocked unit tests with no network, LLM, scanner, or DB side effects
asyncio_mode = strict
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
