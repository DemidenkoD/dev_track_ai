# DevTrack AI — Local single-command stack (Track 6 ownership).
# Usage: `docker compose up --build`  (or `make up`)
# Services: db (Postgres 16) + backend (FastAPI :8000) + worker (same image)
#           + frontend (:5173 -> :80) + prometheus/loki/tempo/grafana.
# Env is read from .env (template: .env.example); sane defaults below keep
# `docker compose config` green even without a .env file.
#
# TELEMETRY SHIPPER GAP (Track 1 / Track 3 must close — Track 6 never edits app code):
# - OTEL traces: OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317 is set on
#   backend/worker, but NO spans flow until Track 1 wires the
#   opentelemetry-sdk OTLP exporter into backend/app (FastAPI instrumentor +
#   exporters) and Track 3 does the same in app.worker.runner.
#   Required Track 1 hook: GET /metrics via prometheus_client (scraped as
#   job "backend", see infra/prometheus/prometheus.yml).
# - Loki logs: containers log to stdout (use `docker logs` / `make logs`).
#   To ship logs to Loki, install the loki docker plugin on the host and
#   uncomment the `logging:` stanzas on backend/worker below
#   (labels {app="backend"} / {app="worker"}). They stay commented because
#   the plugin is absent on a fresh checkout — uncommenting would break `make up`.
# - Telemetry MUST NOT contain emails, JWTs, or API keys (infra/AGENTS.md).
name: devtrack-ai

services:
  db:
    image: postgres:16.4-alpine
    container_name: devtrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devtrack_secret}
      POSTGRES_DB: ${POSTGRES_DB:-devtrack_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-devtrack} -d $${POSTGRES_DB:-devtrack_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: devtrack-ai-backend:local
    container_name: devtrack-backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Loki log shipping (OPT-IN): requires the loki docker plugin on the host:
    #   docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
    # Then uncomment to ship with {app="backend"} labels:
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://localhost:3100/loki/api/v1/push"
    #     loki-external-labels: "app=backend,env=local"
    #     keep-file: "true"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://devtrack:devtrack_secret@db:5432/devtrack_ai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-devtrack-ai-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-300}
      MAX_REPO_SIZE_MB: ${MAX_REPO_SIZE_MB:-250}
    volumes:
      - ./docs:/docs:ro
    ports:
      # Host port is overridable (default 8000) so the stack can coexist
      # with other local projects. Container port is fixed (healthcheck
      # probes localhost:8000 inside the container).
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # No curl in slim image: probe /api/v1/health via stdlib urllib.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [app]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: devtrack-ai-worker:local
    container_name: devtrack-worker
    restart: unless-stopped
    # PostgreSQL-backed job runner sharing the backend image (Track 3 entry).
    command: ["python", "-m", "app.worker.runner"]
    # Loki log shipping (OPT-IN, same plugin prerequisite as backend):
    # uncomment to ship with {app="worker"} labels.
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://localhost:3100/loki/api/v1/push"
    #     loki-external-labels: "app=worker,env=local"
    #     keep-file: "true"
    healthcheck:
      # No pg_isready/curl in the slim backend image: DB reachability via a
      # stdlib TCP dial to db:5432 + worker-process liveness via PID 1
      # cmdline (must be the Track 3 runner). If Track 3 renames the runner
      # module, update the 'runner' assertion below.
      test: ["CMD-SHELL", "python -c \"import socket,pathlib; socket.create_connection(('db',5432),timeout=5).close(); cmd=pathlib.Path('/proc/1/cmdline').read_bytes().decode(); assert 'runner' in cmd, cmd\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://devtrack:devtrack_secret@db:5432/devtrack_ai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-devtrack-ai-worker}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-300}
      MAX_REPO_SIZE_MB: ${MAX_REPO_SIZE_MB:-250}
    volumes:
      - ./docs:/docs:ro
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks: [app]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: devtrack-ai-frontend:local
    container_name: devtrack-frontend
    restart: unless-stopped
    # Host :5173 -> container :80 (documented mapping; vite default port).
    # Host port overridable via FRONTEND_HOST_PORT for coexistence.
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    healthcheck:
      # nginx:alpine ships busybox wget (no curl needed).
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: devtrack-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prom_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [app]

  loki:
    image: grafana/loki:2.9.6
    container_name: devtrack-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [app]

  tempo:
    image: grafana/tempo:2.6.0
    container_name: devtrack-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./infra/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_HOST_PORT:-3200}:3200"   # Tempo query / Grafana datasource
      - "${OTLP_GRPC_HOST_PORT:-4317}:4317"   # OTLP gRPC  (OTEL_EXPORTER_OTLP_ENDPOINT)
      - "${OTLP_HTTP_HOST_PORT:-4318}:4318"   # OTLP HTTP
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [app]

  grafana:
    image: grafana/grafana:10.4.3
    container_name: devtrack-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSONs mount to /var/lib/grafana/dashboards (NOT to
      # /etc/grafana/provisioning/dashboards — that would shadow the
      # dashboards.yml provider config). Must match `path:` in
      # infra/grafana/provisioning/dashboards/dashboards.yml.
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks: [app]

volumes:
  pgdata:
  prom_data:
  loki_data:
  tempo_data:
  grafana_data:

networks:
  app:
    driver: bridge
